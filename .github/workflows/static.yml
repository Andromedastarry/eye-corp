# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyeCorp // The Eye Sees</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap');

        :root {
            --black: #030507;
            --deep-black: #080b0f;
            --panel: #0c1116;
            --cyan: #00f6ff;
            --cyan-dim: #007b83;
            --red: #ff1647;
            --white: #d9faff;
            --muted: #658087;
            --line: rgba(0, 246, 255, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            opacity: 0.06;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 3px,
                    #fff 4px
                );
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 99;
            background: radial-gradient(
                ellipse at center,
                transparent 35%,
                rgba(0, 0, 0, 0.65) 100%
            );
        }

        .cursor {
            position: fixed;
            width: 10px;
            height: 10px;
            border: 1px solid var(--cyan);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 999;
            transition: width .2s, height .2s;
        }

        .cursor::before,
        .cursor::after {
            content: "";
            position: absolute;
            background: var(--cyan);
        }

        .cursor::before {
            width: 20px;
            height: 1px;
            top: 4px;
            left: -6px;
        }

        .cursor::after {
            width: 1px;
            height: 20px;
            left: 4px;
            top: -6px;
        }

        header {
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 50;
            padding: 22px 6vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(
                to bottom,
                rgba(3, 5, 7, 0.96),
                rgba(3, 5, 7, 0)
            );
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--cyan);
            text-shadow: 0 0 12px var(--cyan);
        }

        .eye-logo {
            width: 38px;
            height: 22px;
            border: 2px solid var(--cyan);
            border-radius: 100% 0;
            transform: rotate(45deg);
            position: relative;
            box-shadow: 0 0 14px rgba(0, 246, 255, .4);
        }

        .eye-logo::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--red);
            border-radius: 50%;
            top: 5px;
            left: 13px;
            box-shadow: 0 0 12px var(--red);
        }

        nav {
            display: flex;
            gap: 32px;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            transition: .3s;
        }

        nav a:hover {
            color: var(--cyan);
            text-shadow: 0 0 10px var(--cyan);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 140px 10vw 80px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 700px;
            height: 700px;
            right: -200px;
            top: 100px;
            border: 1px solid var(--line);
            border-radius: 50%;
            box-shadow:
                0 0 0 50px rgba(0,246,255,.015),
                0 0 0 100px rgba(0,246,255,.015),
                0 0 0 150px rgba(0,246,255,.015);
            animation: pulse 5s infinite ease-in-out;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .classified {
            color: var(--red);
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 22px;
            animation: blink 2s infinite;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3.5rem, 9vw, 9rem);
            line-height: .9;
            letter-spacing: -5px;
            text-transform: uppercase;
            color: var(--white);
            text-shadow:
                3px 0 var(--red),
                -3px 0 var(--cyan);
            animation: glitch 4s infinite;
        }

        .tagline {
            margin-top: 35px;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            letter-spacing: 8px;
            color: var(--cyan);
            text-shadow: 0 0 20px var(--cyan);
        }

        .hero-description {
            margin-top: 28px;
            max-width: 560px;
            color: var(--muted);
            line-height: 1.8;
            font-size: 14px;
        }

        .hero-buttons {
            margin-top: 42px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 25px;
            text-decoration: none;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 2px;
            font-size: 11px;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            background: transparent;
            transition: .3s;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--cyan);
            transform: translateX(-100%);
            transition: .3s;
            z-index: -1;
        }

        .btn:hover {
            color: var(--black);
            box-shadow: 0 0 25px rgba(0,246,255,.4);
        }

        .btn:hover::before {
            transform: translateX(0);
        }

        .btn.danger {
            border-color: var(--red);
            color: var(--red);
        }

        .btn.danger::before {
            background: var(--red);
        }

        .btn.danger:hover {
            color: white;
        }

        .eye-interface {
            position: absolute;
            right: 12vw;
            top: 50%;
            transform: translateY(-50%);
            width: 350px;
            height: 350px;
            border: 1px solid var(--line);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotate 25s linear infinite;
        }

        .eye-interface::before,
        .eye-interface::after {
            content: "";
            position: absolute;
            border: 1px solid var(--line);
            border-radius: 50%;
        }

        .eye-interface::before {
            inset: 35px;
        }

        .eye-interface::after {
            inset: 80px;
        }

        .iris {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            border: 2px solid var(--cyan);
            background:
                repeating-conic-gradient(
                    from 0deg,
                    transparent 0deg 15deg,
                    var(--cyan-dim) 16deg 17deg
                );
            box-shadow:
                0 0 20px var(--cyan),
                inset 0 0 25px var(--cyan-dim);
            position: relative;
            animation: rotateReverse 8s linear infinite;
        }

        .iris::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 30px;
            background: var(--red);
            border-radius: 50%;
            top: 35px;
            left: 35px;
            box-shadow: 0 0 30px var(--red);
        }

        section {
            padding: 120px 10vw;
            position: relative;
        }

        .section-label {
            color: var(--red);
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 55px;
            letter-spacing: -2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--line);
        }

        .card {
            min-height: 260px;
            padding: 35px;
            background: var(--panel);
            position: relative;
            overflow: hidden;
            transition: .4s;
        }

        .card:hover {
            background: #101b21;
            transform: translateY(-5px);
        }

        .card-number {
            font-size: 12px;
            color: var(--red);
            letter-spacing: 2px;
        }

        .card h3 {
            margin-top: 45px;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: var(--cyan);
        }

        .card p {
            margin-top: 18px;
            color: var(--muted);
            line-height: 1.7;
            font-size: 13px;
        }

        .card::after {
            content: "";
            position: absolute;
            width: 80px;
            height: 80px;
            border: 1px solid var(--line);
            right: -30px;
            bottom: -30px;
            transform: rotate(45deg);
        }

        .manifesto {
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            text-align: center;
            padding: 150px 15vw;
        }

        .manifesto blockquote {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 4vw, 3.5rem);
            line-height: 1.3;
            color: var(--white);
        }

        .manifesto span {
            color: var(--cyan);
            text-shadow: 0 0 15px var(--cyan);
        }

        .terminal {
            max-width: 850px;
            margin: auto;
            border: 1px solid var(--line);
            background: #05080b;
            box-shadow: 0 0 40px rgba(0, 246, 255, .05);
        }

        .terminal-bar {
            padding: 12px 18px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 11px;
        }

        .terminal-body {
            padding: 28px;
            color: var(--cyan);
            line-height: 2;
            font-size: 13px;
        }

        .terminal-body .warning {
            color: var(--red);
        }

        .terminal-body .dim {
            color: var(--muted);
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 35px 6vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 2px;
        }

        .status {
            color: var(--cyan);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: .5; }
            50% { transform: scale(1.04); opacity: 1; }
        }

        @keyframes rotate {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        @keyframes rotateReverse {
            to { transform: rotate(-360deg); }
        }

        @keyframes blink {
            0%, 45%, 55%, 100% { opacity: 1; }
            50% { opacity: .2; }
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(3px, -2px); }
            94% { transform: translate(-3px, 2px); }
            96% { transform: translate(2px, 1px); }
        }

        @media (max-width: 900px) {
            nav {
                display: none;
            }

            .eye-interface {
                opacity: .2;
                right: -100px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .hero {
                padding-left: 7vw;
                padding-right: 7vw;
            }

            section {
                padding-left: 7vw;
                padding-right: 7vw;
            }

            .manifesto {
                padding-left: 8vw;
                padding-right: 8vw;
            }

            footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="cursor"></div>

    <header>
        <div class="logo">
            <div class="eye-logo"></div>
            EYECORP
        </div>

        <nav>
            <a href="#operations">OPERATIONS</a>
            <a href="#manifesto">MANIFESTO</a>
            <a href="#network">NETWORK</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <div class="hero-content">
                <div class="classified">// CORPORATE INTELLIGENCE DIVISION // EYES ONLY</div>

                <h1>EYECORP</h1>

                <div class="tagline">THE EYE SEES.</div>

                <p class="hero-description">
                    Information is power. Privacy is an illusion.
                    Every transaction. Every movement. Every secret.
                    EyeCorp exists to ensure that nothing escapes the
                    perimeter of observation.
                </p>

                <div class="hero-buttons">
                    <a href="#operations" class="btn">ACCESS OPERATIONS</a>
                    <a href="#network" class="btn danger">ENTER THE NETWORK</a>
                </div>
            </div>

            <div class="eye-interface">
                <div class="iris"></div>
            </div>
        </section>

        <section id="operations">
            <div class="section-label">// CORE OPERATIONS</div>
            <h2>NOTHING<br>REMAINS HIDDEN.</h2>

            <div class="grid">

                <div class="card">
                    <div class="card-number">01 // SURVEILLANCE</div>
                    <h3>OMNIVISION</h3>
                    <p>
                        Eyes in every district. Cameras in every street.
                        We see what others overlook.
                    </p>
                </div>

                <div class="card">
                    <div class="card-number">02 // INTELLIGENCE</div>
                    <h3>DATA HARVEST</h3>
                    <p>
                        Your habits. Your contacts. Your secrets.
                        Everything has value. Everything is catalogued.
                    </p>
                </div>

                <div class="card">
                    <div class="card-number">03 // CONTROL</div>
                    <h3>PERCEPTION</h3>
                    <p>
                        Truth is not what happened.
                        Truth is what the network remembers.
                    </p>
                </div>

            </div>
        </section>

        <section id="manifesto" class="manifesto">
            <blockquote>
                “You cannot hide from what you cannot see.
                <br><br>
                And you cannot escape
                <span>what sees everything.</span>”
            </blockquote>
        </section>

        <section id="network">
            <div class="section-label">// SECURE TERMINAL</div>
            <h2>THE NETWORK<br>IS WATCHING.</h2>

            <div class="terminal">
                <div class="terminal-bar">
                    EYECORP // INTERNAL SYSTEM // NODE 00-Ω
                </div>

                <div class="terminal-body">
                    <div>> INITIALIZING EYECORE...</div>
                    <div>> CONNECTING TO GLOBAL SURVEILLANCE GRID...</div>
                    <div>> 8,421,993,104 ACTIVE NODES DETECTED</div>
                    <div>> IDENTITIES INDEXED: 99.998%</div>
                    <br>
                    <div class="warning">> WARNING: UNAUTHORIZED ACCESS DETECTED</div>
                    <div class="warning">> OBSERVER STATUS: OBSERVED</div>
                    <br>
                    <div class="dim">> You are not anonymous.</div>
                    <div class="dim">> You were never anonymous.</div>
                    <br>
                    <div>> THE EYE SEES.</div>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <div>© 2094 EYECORP // ALL RIGHTS RESERVED</div>
        <div class="status">● NETWORK STATUS: ONLINE</div>
    </footer>

    <script>
        const cursor = document.querySelector('.cursor');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('mouseenter', () => {
                cursor.style.width = '30px';
                cursor.style.height = '30px';
            });

            link.addEventListener('mouseleave', () => {
                cursor.style.width = '10px';
                cursor.style.height = '10px';
            });
        });

        // Random terminal flicker
        setInterval(() => {
            const terminal = document.querySelector('.terminal-body');
            terminal.style.opacity = Math.random() > 0.96 ? '0.5' : '1';

            setTimeout(() => {
                terminal.style.opacity = '1';
            }, 100);
        }, 800);
    </script>

</body>
</html>
